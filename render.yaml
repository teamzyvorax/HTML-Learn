databases:
  - name: zyvora-html-lab-db
    databaseName: zyvora_lab
    user: zyvora_lab_user
    plan: basic_256mb
    region: singapore

services:
  - type: web
    name: zyvora-html-lab-api
    runtime: node
    plan: starter
    region: singapore
    rootDir: api
    buildCommand: npm install && npm run build
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: zyvora-html-lab-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: https://teamzyvorax.github.io,http://localhost:5500
